# Troque seu-dominio.com.br. O certbot completa o bloco HTTPS (listen 443 ssl) automaticamente.
limit_req_zone $binary_remote_addr zone=parkflow_login:10m rate=10r/m;

server {
    listen 80;
    server_name seu-dominio.com.br;

    client_max_body_size 1m;

    # Limita tentativas de login por IP (complementa o bloqueio por usuário do sistema).
    location = /api/login {
        limit_req zone=parkflow_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }
}
